name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
      - name: Prepare single APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk pelops-assistant.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pelops Assistant build ${{ github.run_number }}
          body: "APK de prueba de Pelops Assistant. La conexión a IA en la nube aún no está incluida."
          files: pelops-assistant.apk
          make_latest: true
